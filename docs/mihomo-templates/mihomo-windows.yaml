# ============================================================
# mihomo 订阅格式模板 · Windows（Clash Verge Rev / Mihomo Party / FlClash PC）
# ------------------------------------------------------------
# 用法 A（推荐，配合面板）：
#   面板 → 订阅格式 → 新建/编辑 mihomo 配置 → 粘贴本文件 → 保存。
#   本文件不含 proxies / proxy-providers：节点由面板按套餐动态生成，
#   ?providers=1 时自动输出 proxy-providers，组里自动补 use。
#   标了 _hasExternalNodes: true 的组，就是节点注入的位置。
#
# 用法 B（脱离面板单独用）：
#   自己补一段 proxies:（或 proxy-providers: + 组内 use），见 README。
#
# 说明：
#   - DNS 国内走阿里 / 腾讯公共 DoH，国外走 Google / Cloudflare 公共 DoH；
#   - 广告拦截、QUIC(443/UDP) 阻断、STUN(3478/19302) 阻断均已配置；
#   - 规则库地址是 rules.example.com 占位，换成自己的即可。
# ============================================================

