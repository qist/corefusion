# ============================================================
# mihomo 订阅格式模板 · OpenClash（OpenWrt 路由器）
# ------------------------------------------------------------
# 用法 A（推荐，配合面板）：
#   面板 → 订阅格式 → 粘贴本文件 → 保存；或下载后由 OpenClash 订阅地址拉取。
#   节点由面板按套餐动态生成，?providers=1 时自动输出 proxy-providers；
#   标了 _hasExternalNodes: true 的组就是节点注入的位置。
#
# 用法 B（脱离面板单独用）：自己补 proxies / proxy-providers，见 README。
#
# 说明：
#   - allow-lan 打开，供局域网设备转发；external-controller 监听 0.0.0.0，
#     如无需要请改成 127.0.0.1 或设置 secret；
#   - DNS 用公共 DoH（223.5.5.5 / 119.29.29.29 做 bootstrap）；
#   - SSH(22) 走 🖥️ SSH 组（默认 ✈️ 墙外网站，可切 DIRECT）；STUN(3478/19302) 直接 REJECT；
#   - tun 段保留，但实际以 OpenClash 面板开关为准。
# ============================================================

allow-lan: true
bind-address: '*'
dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:53
  enhanced-mode: redir-host
  cache-algorithm: arc
  fake-ip-range: 198.19.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
