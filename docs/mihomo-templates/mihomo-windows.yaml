tcp-concurrent: true
tproxy-port: 0
unified-delay: true
rules:
- RULE-SET,private,DIRECT
- RULE-SET,privatecn,DIRECT
- RULE-SET,reject,🛑 广告拦截
- GEOSITE,category-ads-all,🛑 广告拦截
- RULE-SET,applications,DIRECT
- AND,(AND,(DST-PORT,443),(NETWORK,UDP)),(NOT,((GEOSITE,cn))),REJECT
- AND,(AND,(DST-PORT,443),(NETWORK,UDP)),(NOT,((GEOIP,CN))),REJECT
- AND,(AND,(DST-PORT,443),(NETWORK,UDP)),(NOT,((RULE-SET,allcidr))),REJECT
- AND,(AND,(DST-PORT,443),(NETWORK,UDP)),(NOT,((RULE-SET,allipv6cidr))),REJECT
- AND,(AND,(DST-PORT,443),(NETWORK,UDP)),(NOT,((RULE-SET,cncidr))),REJECT
- AND,(AND,(DST-PORT,443),(NETWORK,UDP)),(NOT,((RULE-SET,direct))),REJECT
- AND,(AND,(DST-PORT,443),(NETWORK,UDP)),(NOT,((RULE-SET,lancidr))),REJECT
- AND,((NETWORK,UDP),(DST-PORT,3478/19302)),REJECT
- DST-PORT,22,🖥️ SSH,no-resolve
- RULE-SET,lancidr,DIRECT,no-resolve
- RULE-SET,allcidr,DIRECT,no-resolve
- RULE-SET,allipv6cidr,DIRECT,no-resolve
- RULE-SET,cncidr,DIRECT,no-resolve
- RULE-SET,direct,DIRECT
- GEOSITE,cn,DIRECT
- GEOIP,private,DIRECT
- GEOIP,CN,DIRECT
- RULE-SET,icloud,🍏 苹果
- RULE-SET,apple,🍏 苹果
- RULE-SET,win-spy,Ⓜ️ 微软
- RULE-SET,win-update,Ⓜ️ 微软
- RULE-SET,win-extra,Ⓜ️ 微软
- RULE-SET,googlel,🐓 谷歌
- RULE-SET,Foreignmedia,🌍 国外媒体
- RULE-SET,Netflix,🎥 NETFLIX
- RULE-SET,proxy,✈️ 墙外网站
- RULE-SET,gfw,✈️ 墙外网站
- RULE-SET,tld-not-cn,✈️ 墙外网站
- RULE-SET,telegramcidr,✈️ 墙外网站
