name: 问题报告 / Bug Report
description: "请创建一个问题报告以帮助我们改进。Create a bug report to help us improve."
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈问题！请尽量用中文或英文填写，信息越完整我们越能快速定位。
        Thanks for reporting! Please fill in as much detail as possible (Chinese or English).

        > **安全漏洞请勿在此公开提交**（含可利用细节、复现 payload、未修复的凭证泄露）。
        > 请通过仓库 **Security → Report a vulnerability** 私下报告。
        > Do **not** report security vulnerabilities here — use Security → Report a vulnerability.

  - type: checkboxes
    id: terms
    attributes:
      label: 提交前确认 / Pre-submission checklist
      options:
        - label: 我正在使用最新的主要版本（仅此受支持）。 / I am on the latest major version.
          required: true
        - label: 我正在使用受支持的操作系统。 / I am on a supported OS.
          required: true
        - label: 我已阅读相关文档仍无法解决。 / I have read the docs and still cannot resolve it.
          required: true
        - label: 我已搜索过类似 Issue，未找到相同问题。 / I searched existing issues and found none.
          required: true
        - label: 我确认该问题非第三方插件/修改引起。 / Not caused by third-party plugins or local modifications.
          required: false

  - type: dropdown
    id: category
    attributes:
      label: 问题分类 / Category
      description: 问题大致属于哪个模块？ / Which module is affected?
      options:
        - 面板 / Panel (Web 界面、API)
        - 节点与 Agent / Node & Agent (心跳、指令下发、自更新)
        - 代理核心 / Core (Xray-core、sing-box 启停与配置生成)
        - 反向代理 / Proxy (Caddy、Nginx、WAF)
        - 订阅 / Subscription (分享链接、订阅格式、端点)
        - 客户与计费 / Customer & Billing (套餐、订单、充值、佣金)
        - 证书 / Certificate (ACME、DNS-01、HTTP-01、分发)
        - 流量与限流 / Traffic & Ratelimit (统计、配额、限速)
        - 安装 / 部署 / 升级 (安装脚本、迁移、构建)
        - 其他 / Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: CoreFusion 版本 / Version
      description: 面板页脚或 `./corefusion version` 的输出。 / Output of `./corefusion version`.
      placeholder: "v0.12.298"
    validations:
      required: true

  - type: dropdown
    id: deploy
    attributes:
      label: 部署方式 / Deployment
      description: 面板是怎么跑起来的？ / How is the panel running?
      options:
        - systemd 服务 / systemd unit (deploy/corefusion.service)
        - nohup 手动启动 / manual nohup
        - 源码直接运行 / go run or built binary in place
        - 其他 / Other
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统 / Operating System
      options:
        - Ubuntu 22.04+
        - Debian 11+
        - CentOS 7 / Rocky / Alma
        - Alpine
        - Other Linux
        - macOS
        - Windows (WSL)
    validations:
      required: true

  - type: dropdown
    id: database
    attributes:
      label: 数据库 / Database
      description: 由 `.env` 的 `CF_DB_DSN` 前缀决定。 / Determined by the `CF_DB_DSN` prefix in `.env`.
      options:
        - SQLite (默认 / default)
        - MySQL
        - PostgreSQL
        - 不确定 / Not sure
    validations:
      required: true

  - type: dropdown
    id: proxy
    attributes:
      label: 反向代理 / WAF
      description: 面板或节点上启用的代理与防护组件。 / Proxy & WAF in use.
      options:
        - 未启用 / None
        - Caddy
        - Nginx
        - Caddy + CaddyGuard
        - Nginx + NginxGuard
        - 不确定 / Not sure
    validations:
      required: true

  - type: dropdown
    id: core
    attributes:
      label: 代理核心 / Core
      description: 问题涉及哪个核心？Hysteria2/TUIC 等 QUIC 协议由 sing-box 承载。 / Which core? QUIC protocols are served by sing-box.
      options:
        - 不涉及核心 / Not core-related
        - Xray-core
        - sing-box
        - 两个都有 / Both
        - 不确定 / Not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 问题描述 / Problem description
      description: 简明描述你遇到的问题。 / A clear and concise description of the bug.
      placeholder: 发生了什么？ / What happened?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 一步步说明如何复现。 / Steps to reproduce the behavior.
      value: |-
        1. 进入 '...'
        2. 点击 '...'
        3. 滚动到 '...'
        4. 出现错误
    validations:
      required: true

  - type: dropdown
    id: reproducible
    attributes:
      label: 可复现性 / Reproducibility
      options:
        - 每次都能复现 / Always
        - 偶发 / Intermittent
        - 只出现过一次 / Once
        - 还没能复现 / Not reproduced yet
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为 / Expected behavior
      description: 你期望发生什么？ / What did you expect to happen?
    validations:
      required: false

  - type: textarea
    id: actual
    attributes:
      label: 实际行为 / Actual behavior
      description: 实际发生了什么（含报错信息）？ / What actually happened (with errors)?
    validations:
      required: false

  - type: textarea
    id: log
    attributes:
      label: 日志 / Logs
      description: |
        请粘贴相关日志（脱敏后）。 / Paste relevant logs (sanitized).

        面板：`journalctl -u corefusion -n 200 --no-pager`，或 `nohup` 启动时看 `corefusion.log`；
        代理与 WAF：`data/logs/`（如 `access.log`、`nginx-error.log`、`caddy_access.log`、`*_waf.log`）；
        核心：`data/logs/<core>.log`（`xray.log` / `sing-box.log`）；
        远程节点：在节点上 `journalctl -u corefusion-agent -n 200 --no-pager`。
      value: |-
        <details>

        ```console
        # 请在此粘贴日志 / paste logs here
        ```

        </details>
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: 相关配置 / Configuration (optional)
      description: 相关配置片段（请隐藏敏感信息如 token、密码、域名、订阅链接）。 / Sanitized config snippets.
      value: |-
        <details>

        ```yaml
        # 请在此粘贴（脱敏） / paste here (redacted)
        ```

        </details>
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充说明 / Additional context
      description: 截图、录屏、相关链接等。 / Screenshots, links, or anything else.
    validations:
      required: false
