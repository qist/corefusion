syntax = "proto3";

package corefusion.agent.v1;

option go_package = "corefusion/internal/runtime/agent/proto;agentpb";

// ============================================================
// 核心设计原则
// ============================================================
// 所有"系统控制操作"（start/stop/restart/reload/sync config）
// 本质上是异步任务，不能设计为同步 RPC 等待执行完成。
//
// 模型：
//   Panel → Agent: 下发命令（立刻返回 accepted + task_id）
//   Agent 内部:   TaskQueue → Worker Pool → 执行
//   Agent → Panel: 通过 stream 回传 TaskResult
//   Panel 查询:    GetTask(task_id) 获取最新状态
//
// 幂等控制：
//   每个 PanelCommand 携带 idempotency_key
//   Agent 对同一 key 的重复命令自动去重（返回已有 task_id）

// ============================================================
// AgentService — Agent 侧提供的 gRPC 服务（面板→Agent 指令）
// ============================================================
service AgentService {
  // --- 同步查询类 RPC（纯读，不涉及长操作） ---
  // 获取当前状态快照
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  // 获取详细资源指标（用于监控图表）
  rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse);
  // 查询代理安装状态
  rpc GetProxyStatus(GetProxyStatusRequest) returns (GetProxyStatusResponse);
  // 列出已安装的核心二进制
  rpc ListBinaries(ListBinariesRequest) returns (ListBinariesResponse);
  // 获取 GitHub 上的可用版本列表
  rpc ListReleases(ListReleasesRequest) returns (ListBinariesResponse);
  // 下载 Geo 规则文件到 Agent 本地
  rpc DownloadGeoRule(DownloadGeoRuleRequest) returns (DownloadGeoRuleResponse);
  // 节点测速（TCP 连接延迟探测）
  rpc SpeedTest(SpeedTestRequest) returns (SpeedTestResponse);
  // 读取节点上的配置文件（如 runtime/xray.jsonc）
  rpc ReadConfigFile(ReadConfigFileRequest) returns (ReadConfigFileResponse);

  // --- 异步任务类 RPC（立刻返回 accepted + task_id） ---
  // 启动/停止/重启核心进程 → 返回 TaskAccept
  rpc ControlCore(ControlCoreRequest) returns (TaskAccept);
  // 启动/停止/重启/重载代理进程 → 返回 TaskAccept
  rpc ControlProxy(ControlProxyRequest) returns (TaskAccept);
  // 同步完整核心配置 → 返回 TaskAccept
  rpc SyncConfig(SyncConfigRequest) returns (TaskAccept);
  // 同步代理配置 → 返回 TaskAccept
  rpc SyncProxyConfig(SyncProxyConfigRequest) returns (TaskAccept);
  // 增删改用户（热生效） → 返回 TaskAccept
  rpc AlterUsers(AlterUsersRequest) returns (TaskAccept);
  // 应用限速规则 → 返回 TaskAccept
  rpc ApplyLimits(ApplyLimitsRequest) returns (TaskAccept);
  // 安装核心二进制 → 返回 TaskAccept
  rpc InstallBinary(InstallBinaryRequest) returns (TaskAccept);
  // 安装代理二进制 → 返回 TaskAccept
  rpc InstallProxy(InstallProxyRequest) returns (TaskAccept);
  // Agent 自动更新 → 返回 TaskAccept
  rpc UpdateAgent(UpdateAgentRequest) returns (TaskAccept);

  // --- xray API 代理（面板→Agent→本地 xray gRPC） ---
  // 通用 xray API 调用代理，支持 inbound/outbound/user/routing/balancer/stats
  rpc XrayAPI(XrayAPIRequest) returns (XrayAPIResponse);
  // 列出网络接口（用于端口跳跃等场景）
  rpc ListInterfaces(ListInterfacesRequest) returns (ListInterfacesResponse);
  // 在 Agent 节点上执行核心二进制命令（如 x25519、wg-key 等）
  rpc ExecuteBinary(ExecuteBinaryRequest) returns (ExecuteBinaryResponse);

  // --- 数据同步（面板→Agent 数据库级别同步） ---
  // 同步面板数据库中与该节点相关的配置数据到 Agent 本地数据库
  // Agent 收到后写入本地 SQLite，然后从本地数据库生成配置文件并启动核心
  rpc SyncData(SyncDataRequest) returns (SyncDataResponse);

  // --- 任务查询 ---
  // 查询异步任务执行状态
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
}

// ============================================================
// HeartbeatService — 面板侧提供的 gRPC 服务（Agent→面板 上报）
// ============================================================
service HeartbeatService {
  // 双向流：Agent 持续上报心跳和指标，面板可随时下发指令
  rpc Stream(stream AgentReport) returns (stream PanelCommand);
}

// ============================================================
// RegistrationService — 面板侧提供（Agent 首次 Bootstrap 注册）
// ============================================================
service RegistrationService {
  // Agent 首次使用 Bootstrap Token 注册
  rpc Register(RegisterRequest) returns (RegisterResponse);
}

// ============================================================
// 任务模型 — 所有异步操作的统一返回
// ============================================================

// TaskAccept — 异步任务接受确认，立刻返回。
// 面板收到后不再等待执行完成，而是通过 GetTask 或 stream 回传的
// TaskResult 来获知最终结果。
message TaskAccept {
  bool   accepted = 1;              // 命令是否被接受
  string task_id = 2;               // 任务 ID（UUID），后续查询用
  string idempotency_key = 3;       // 回传幂等 key（去重用）
  string reject_reason = 4;         // 拒绝原因（accepted=false 时）
}

// TaskStatus — 任务状态枚举
enum TaskStatus {
  TASK_UNKNOWN = 0;
  TASK_QUEUED = 1;                   // 已入队，等待 Worker 执行
  TASK_RUNNING = 2;                 // 正在执行中
  TASK_SUCCESS = 3;                 // 执行成功
  TASK_FAILED = 4;                  // 执行失败
}

// GetTaskRequest — 查询任务状态
message GetTaskRequest {
  string task_id = 1;
}

// GetTaskResponse — 任务状态响应
message GetTaskResponse {
  string task_id = 1;
  TaskStatus status = 2;
  string error = 3;                 // 失败原因
  int64  created_at = 4;           // 任务创建时间
  int64  finished_at = 5;          // 任务完成时间（0=未完成）
  string task_type = 6;            // 任务类型（control_core/control_proxy/sync_config 等）
  string detail_json = 7;          // 任务详细结果（JSON，类型相关）
}

// ============================================================
// 面板 → Agent 指令消息
// ============================================================

message SyncConfigRequest {
  string core_type = 1;           // xray/singbox/hysteria2/tuic
  bytes  config_content = 2;      // 完整配置文件内容（JSONC）
  int64  config_version = 3;      // 配置版本号（用于增量判断）
}

message ControlCoreRequest {
  string core_type = 1;
  string action = 2;              // start/stop/restart
}

// ============================================================
// 代理进程管理（Caddy/Nginx）
// ============================================================

message SyncProxyConfigRequest {
  string proxy_type = 1;          // caddy/nginx
  bytes  config_content = 2;      // 完整配置文件内容（Caddyfile / nginx.conf）
  repeated CertificateEntry certificates = 3;  // 代理站点引用的 TLS 证书（落地到 Agent 磁盘）
}

message ControlProxyRequest {
  string proxy_type = 1;          // caddy/nginx
  string action = 2;              // start/stop/restart/reload
}

message AlterUsersRequest {
  string core_type = 1;
  string inbound_tag = 2;
  string action = 3;              // add/remove/update
  repeated UserOp users = 4;
}

message UserOp {
  string email = 1;
  string uuid = 2;
  string password = 3;
  int32  level = 4;               // Xray level（限速映射）
  string flow = 5;                // VLESS flow
  string encryption = 6;          // VLESS encryption
  map<string, string> extra = 7;  // 协议特定字段
}

message ApplyLimitsRequest {
  enum LimitType { SPEED = 0; CONN = 1; DEVICE = 2; }
  LimitType type = 1;
  string action = 2;              // apply/remove
  string ip = 3;
  int32  value = 4;               // speed: Mbps, conn: count, device: count
  int64  subscription_id = 5;
}

message GetStatusRequest {}

message GetStatusResponse {
  repeated CoreStatus cores = 1;
  double cpu_usage = 2;
  int64  mem_usage_bytes = 3;
}

// ============================================================
// Agent 自动更新
// ============================================================

message UpdateAgentRequest {
  string target_version = 1;       // 目标版本号
  string download_url = 2;         // 新版本下载 URL
  string checksum = 3;             // SHA-256 校验和
  bool   force = 4;                // 强制更新（即使版本相同）
}

// ============================================================
// 配置文件读取（面板→Agent 读取节点本地配置文件）
// ============================================================

message ReadConfigFileRequest {
  string core_type = 1;            // xray/singbox/hysteria2/tuic
}

message ReadConfigFileResponse {
  bool   success = 1;
  string error = 2;
  bytes  content = 3;               // 文件内容
  string file_path = 4;            // 文件路径
}

// ============================================================
// 节点测速
// ============================================================

message SpeedTestRequest {
  string target_host = 1;          // 测速目标主机
  int32  target_port = 2;          // 测速目标端口
  int32  timeout_ms = 3;           // 超时时间（毫秒）
  int32  samples = 4;              // 采样次数（取平均值）
}

message SpeedTestResponse {
  bool   success = 1;
  string error = 2;
  int32  latency_ms = 3;           // 平均延迟（毫秒）
  int32  jitter_ms = 4;            // 抖动（毫秒）
  double packet_loss = 5;          // 丢包率（0-1）
  int64  download_bps = 6;         // 下载速度（bps，可选测速）
  int64  upload_bps = 7;           // 上传速度（bps，可选测速）
}

// ============================================================
// 资源指标查询（用于监控图表）
// ============================================================

message GetMetricsRequest {
  int32  last_n_points = 1;        // 返回最近 N 个数据点（0=全部）
  string metric_type = 2;          // 指标类型：cpu/mem/disk/net/traffic（空=全部）
}

message GetMetricsResponse {
  repeated MetricPoint points = 1;
}

message MetricPoint {
  int64  timestamp = 1;
  double cpu_usage = 2;             // CPU 使用率 0-100
  int64  mem_usage_bytes = 3;
  int64  disk_usage_bytes = 4;
  int64  net_rx_bytes = 5;          // 网络接收字节（累计或速率）
  int64  net_tx_bytes = 6;          // 网络发送字节
  double load_1m = 7;              // 1 分钟负载
  int32  tcp_connections = 8;      // TCP 连接数
  int64  traffic_uplink = 9;       // 用户上行流量（字节/秒）
  int64  traffic_downlink = 10;    // 用户下行流量（字节/秒）
}

// ============================================================
// 二进制安装（核心 + 代理）
// ============================================================

message InstallBinaryRequest {
  string core_type = 1;            // xray/singbox/hysteria2/tuic
  string version = 2;              // 目标版本号（如 v1.8.6）
  string download_url = 3;         // 下载 URL（空则自动构建）
  string asset_name = 4;           // 指定 asset 名称（可选）
  string accel_domain = 5;         // GitHub 加速域名（可选）
  string proxy_url = 6;            // HTTP 代理 URL（可选）
}

message InstallProxyRequest {
  string proxy_type = 1;           // caddy/nginx
  string accel_domain = 2;         // GitHub 加速域名（可选）
  string proxy_url = 3;            // HTTP 代理 URL（可选）
  string download_url = 4;         // 指定下载 URL（可选，空则自动获取最新版本）
  string tag_name = 5;             // 目标版本号（可选）
}

message GetProxyStatusRequest {}

message GetProxyStatusResponse {
  repeated ProxyInfo proxies = 1;
}

message ProxyInfo {
  string type = 1;
  string name = 2;
  bool   installed = 3;
  string version = 4;
  string path = 5;
  string status = 6;               // running/stopped
  bool   managed = 7;
}

message ListBinariesRequest {}

message ListBinariesResponse {
  repeated BinaryInfo binaries = 1;
  repeated ReleaseInfo releases = 2;  // 也承载 ListReleases 结果
}

message BinaryInfo {
  string core_type = 1;
  string version = 2;
  string binary_path = 3;
  bool   installed = 4;
}

// ListReleases 获取 GitHub 上的可用版本列表
message ListReleasesRequest {
  string core_type = 1;
}

message ReleaseInfo {
  string version = 1;
  bool   prerelease = 2;
}

// ============================================================
// Geo 规则文件下载（面板→Agent）
// ============================================================

message DownloadGeoRuleRequest {
  string file_name = 1;            // 文件名（如 geoip.dat）
  string download_url = 2;         // 下载 URL
  string accel_domain = 3;         // GitHub 加速域名（可选）
  string proxy_url = 4;            // HTTP 代理 URL（可选）
}

message DownloadGeoRuleResponse {
  bool   success = 1;
  string error = 2;
  int64  file_size = 3;            // 下载的文件大小
  string file_path = 4;            // 保存路径
}

// ============================================================
// Agent → 面板 上报消息
// ============================================================

message AgentReport {
  enum ReportType { HEARTBEAT = 0; STATUS = 1; TRAFFIC = 2; CRASH = 3; TASK_RESULT = 4; }
  ReportType type = 1;
  int64  server_id = 2;
  int64  timestamp = 3;

  // HEARTBEAT
  string agent_version = 10;
  double cpu_usage = 11;          // 0-100
  int64  mem_usage_bytes = 12;
  int64  disk_usage_bytes = 13;
  int64  net_rx_bytes = 14;
  int64  net_tx_bytes = 15;
  string os = 16;                 // Agent's GOOS (linux, darwin, windows)
  string arch = 17;               // Agent's GOARCH (amd64, arm64, etc.)
  string distro = 18;             // Agent's Linux distro (debian, ubuntu, redhat, alpine, etc.)

  // STATUS
  repeated CoreStatus cores = 20;

  // TRAFFIC
  repeated TrafficStat traffic_stats = 30;

  // CRASH
  string crashed_core = 40;
  string crash_log = 41;

  // TASK_RESULT — 异步任务执行结果
  TaskResult task_result = 50;
}

message CoreStatus {
  string core_type = 1;
  string state = 2;               // running/stopped/crashed/starting/stopping/restarting
  int32  pid = 3;
  int64  started_at = 4;
  int64  uptime_seconds = 5;
  double cpu_usage = 6;
  int64  mem_usage_bytes = 7;
}

message TrafficStat {
  string user_email = 1;
  int64  uplink_bytes = 2;
  int64  downlink_bytes = 3;
  int64  session_start = 4;
  string core_type = 5;
}

// ============================================================
// 面板 → Agent 流式指令（通过 HeartbeatService.Stream 下发）
// ============================================================

message PanelCommand {
  string command_id = 20;            // 命令追踪 ID（UUID）
  string idempotency_key = 21;       // 幂等 key — 防止重复执行同一操作
  oneof command {
    SyncConfigRequest sync_config = 1;
    ControlCoreRequest control_core = 2;
    AlterUsersRequest alter_users = 3;
    ApplyLimitsRequest apply_limits = 4;
    GetStatusRequest get_status = 5;
    RenewCertCommand renew_cert = 6;           // 证书续签（热替换）
    DistributeCertCommand distribute_cert = 7; // 分发外部服务证书
    SyncProxyConfigRequest sync_proxy_config = 8;   // 同步代理配置
    ControlProxyRequest control_proxy = 9;          // 控制代理进程
    UpdateAgentCommand update_agent = 10;           // Agent 自动更新
    SyncDataRequest sync_data = 11;                    // 数据库级别数据同步

    // --- 新增：通过 Stream 下发的原 AgentService RPC ---
    InstallBinaryRequest install_binary = 12;         // 安装核心二进制
    InstallProxyRequest install_proxy = 13;           // 安装代理二进制
    GetMetricsRequest get_metrics = 14;              // 获取资源指标
    ListBinariesRequest list_binaries = 15;          // 列出已安装二进制
    GetProxyStatusRequest get_proxy_status = 16;     // 查询代理状态
    SpeedTestRequest speed_test = 17;                // 节点测速
    DownloadGeoRuleRequest download_geo_rule = 18;   // 下载 Geo 规则
    ListInterfacesRequest list_interfaces = 19;      // 列出网络接口
    ExecuteBinaryRequest execute_binary = 22;        // 执行二进制命令
    XrayAPIRequest xray_api = 23;                    // Xray API 代理
    ReadConfigFileRequest read_config_file = 24;     // 读取配置文件
  }
}

// ============================================================
// 任务执行结果回传（Agent→面板，通过 stream）
// ============================================================

message TaskResult {
  string task_id = 1;                // 对应 PanelCommand.command_id
  string idempotency_key = 2;        // 回传幂等 key
  TaskStatus status = 3;             // 任务最终状态
  string error = 4;                  // 失败原因
  int64  created_at = 5;            // 任务创建时间
  int64  finished_at = 6;           // 任务完成时间
  string task_type = 7;              // control_core / control_proxy / sync_config 等
  string detail_json = 8;            // 类型相关的详细结果（JSON）
}

// Agent 自动更新指令（通过流推送，Agent 自行下载更新）
message UpdateAgentCommand {
  string version = 1;              // 目标版本号
  string download_url = 2;         // 下载 URL
  string checksum = 3;             // SHA-256 校验和
}

// 证书续签指令（面板→Agent，通过流推送）
message RenewCertCommand {
  bytes  new_cert_pem = 1;     // 新的 Agent mTLS 证书
  bytes  new_key_pem = 2;      // 新的 Agent 私钥
  int64  expires_at = 3;       // 新证书过期时间戳
}

// 外部服务证书分发（面板→Agent）
message DistributeCertCommand {
  string cert_name = 1;        // 证书名称/标识
  bytes  cert_pem = 2;         // 证书 PEM
  bytes  key_pem = 3;          // 私钥 PEM
  bytes  fullchain_pem = 4;    // 完整证书链
  string target_path = 5;      // Agent 侧保存路径
  int64  expires_at = 6;       // 证书过期时间
  bool   reload_core = 7;      // 是否需要重载核心配置
}

// ============================================================
// Bootstrap 注册消息
// ============================================================

message RegisterRequest {
  string bootstrap_token = 1;
  string server_name = 2;       // Agent 自报的服务器名称（需匹配）
  string agent_version = 3;
  repeated string supported_cores = 4;
  string public_ip = 5;
}

message RegisterResponse {
  bool   success = 1;
  string error = 2;
  int64  server_id = 3;
  bytes  agent_cert_pem = 4;    // 签发的 Agent mTLS 证书
  bytes  agent_key_pem = 5;     // Agent 私钥
  bytes  ca_cert_pem = 6;       // CA 根证书（用于验证面板）
  int64  cert_expires_at = 7;   // 证书过期时间戳
}

// ============================================================
// xray API 代理（面板→Agent→本地 xray gRPC）
// ============================================================

// XrayAPIRequest — 通用 xray API 调用请求。
// 面板将操作类型和 JSON payload 发给 Agent，Agent 转换为
// xray gRPC 调用并返回结果。
message XrayAPIRequest {
  string service = 1;    // "proxyman" | "router" | "stats"
  string method = 2;     // "addInbound" | "removeInbound" | "addOutbound" | "removeOutbound"
                         // | "addUser" | "removeUser" | "applyRouting" | "addRoutingRule"
                         // | "removeRoutingRule" | "listRoutingRules" | "getBalancerInfo"
                         // | "setBalancerTarget" | "getStats" | "resetStats"
  bytes  payload = 3;    // JSON-encoded 请求参数（方法相关）
}

// XrayAPIResponse — xray API 调用响应。
message XrayAPIResponse {
  bool   success = 1;
  string error = 2;
  bytes  response = 3;   // JSON-encoded 响应数据（方法相关）
}

// ============================================================
// 网络接口查询
// ============================================================

message ListInterfacesRequest {}

message ListInterfacesResponse {
  repeated string interfaces = 1;
}

// ============================================================
// 数据同步（面板→Agent 数据库级别同步）
// ============================================================

// SyncDataRequest — 面板将指定 server_id 的所有相关配置表数据发送给 Agent。
// Agent 收到后写入本地 SQLite 数据库，然后从本地数据生成配置文件并启动核心。
// 这确保了 Agent 可以独立于面板运行——即使面板不可达，Agent 也能从
// 本地数据库生成正确的配置并启动核心。
message SyncDataRequest {
  int64 server_id = 1;             // 目标服务器 ID

  // core_configs 表数据（按 section 存储，每个 section 一条）
  repeated CoreConfigEntry core_configs = 2;

  // inbound_configs 表数据
  repeated InboundConfigEntry inbound_configs = 3;

  // outbound_configs 表数据
  repeated OutboundConfigEntry outbound_configs = 4;

  // warp_configs 表数据
  repeated WarpConfigEntry warp_configs = 5;

  // share_domain_configs 表数据
  repeated ShareDomainConfigEntry share_domain_configs = 6;

  // 同步完成后是否自动生成配置并启动核心
  bool apply_and_start = 7;

  // 配置版本号（用于幂等判断）
  int64 config_version = 8;

  // 面板侧已经 PrepareFullConfig 生成好的最终运行时配置（JSON bytes）
  // Agent 收到后直接写入 runtime 目录即可，无需自己从 DB 行重新组装
  // 这避免了 Agent 侧需要重新实现 PrepareFullConfig 的全部逻辑
  bytes  config_content = 9;

  // config_content 对应的核心类型（xray/singbox/...）
  string config_core_type = 10;

  // 该节点使用的所有 TLS 证书（PEM 内容），Agent 落地到本地磁盘
  repeated CertificateEntry certificates = 11;
}

// CertificateEntry — 证书条目，面板→Agent 同步证书 PEM 内容。
// Agent 收到后将内容写入 dataDir + cert_path / key_path 对应的文件。
message CertificateEntry {
  int64  id = 1;              // 证书 ID
  string domain = 2;          // 主域名
  string cert_path = 3;       // 证书文件相对路径（与 xray config 中引用的一致）
  string key_path = 4;        // 私钥文件相对路径
  string fullchain_path = 5;  // fullchain 相对路径
  string cert_content = 6;    // 证书 PEM 内容
  string key_content = 7;     // 私钥 PEM 内容
  string fullchain_content = 8; // fullchain PEM 内容（为空时用 cert_content）
  int64  expires_at = 9;      // 过期时间戳
}

message CoreConfigEntry {
  int64  id = 1;
  int64  server_id = 2;
  string core_type = 3;
  string section = 4;
  string config_json = 5;
  int64  updated_at = 6;
}

message InboundConfigEntry {
  int64  id = 1;
  string remark = 2;
  string core_type = 3;
  string protocol = 4;
  string tag = 5;
  string listen = 6;
  int32  port = 7;
  string config_json = 8;
  bool   enabled = 9;
  int64  server_id = 10;
  string region = 11;
  int64  created_at = 12;
  int64  updated_at = 13;
}

message OutboundConfigEntry {
  int64  id = 1;
  int64  server_id = 2;
  string remark = 3;
  string core_type = 4;
  string protocol = 5;
  string tag = 6;
  string config_json = 7;
  bool   enabled = 8;
  bool   is_default = 9;
  int64  created_at = 10;
  int64  updated_at = 11;
}

message WarpConfigEntry {
int64  id = 1;
string device_id = 2;
string token = 3;
string private_key = 4;
string public_key = 5;
string reserved = 6;
string address_ipv4 = 7;
string address_ipv6 = 8;
string endpoint = 9;
string client_id = 10;
string account_id = 11;
string account_type = 12;
string license_key = 13;
int64  registration_at = 14;
string status = 15;
string config_json = 16;
int64  created_at = 17;
int64  updated_at = 18;
int64  server_id = 19;
string core_type = 20;
string remark = 21;
}

message ShareDomainConfigEntry {
  int64  id = 1;
  string type = 2;
  string value = 3;
  int32  port = 4;
  string ports = 5;
  bool   enabled = 6;
  int32  sort_order = 7;
  int64  server_id = 8;
  string region = 9;
  int64  created_at = 10;
  int64  updated_at = 11;
}

message SyncDataResponse {
  bool   success = 1;
  string error = 2;
  int32  core_configs_applied = 3;
  int32  inbound_configs_applied = 4;
  int32  outbound_configs_applied = 5;
  int32  warp_configs_applied = 6;
  int32  share_domain_configs_applied = 7;
  bool   config_generated = 8;
  bool   core_started = 9;
}

// ============================================================
// 核心二进制命令执行（Agent 节点本地执行）
// ============================================================

message ExecuteBinaryRequest {
  string core_type = 1;          // xray/singbox/hysteria2/tuic
  repeated string args = 2;      // 命令行参数
  bool   raw_output = 3;         // true: 返回原始 stdout; false: 解析为 key:value
}

message ExecuteBinaryResponse {
  bool   success = 1;
  string error = 2;
  string stdout = 3;             // 原始 stdout（raw_output=true 时使用）
  map<string, string> parsed = 4; // 解析后的 key:value（raw_output=false 时使用）
}
