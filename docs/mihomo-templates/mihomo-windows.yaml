  use-hosts: true
  prefer-h3: false
  respect-rules: false
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  - 1.1.1.1
  proxy-server-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  - 1.1.1.1
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  fallback:
  - https://dns.google/dns-query
  - https://cloudflare-dns.com/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
    - 240.0.0.0/4
  nameserver-policy:
    +.google.cn,+.cn:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    geosite:category-ads-all:
    - rcode://success
    geosite:cn,private,apple,geolocation-cn,win-spy,win-update,win-extra:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    geosite:geolocation-!cn,!cn,gfw:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
    rule-set:Foreignmedia,Netflix,domain-proxy-cidr,proxy,gfw,tld-not-cn:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
    rule-set:direct,privatecn,icloud,apple,win-spy,win-update,win-extra,googlel:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    rule-set:reject:
    - rcode://success
