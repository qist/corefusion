secret: ''
socks-port: 0
tcp-concurrent: true
tproxy-port: 0
tun:
  auto-detect-interface: false
  auto-redirect: false
  auto-route: false
  device: utun
  disable-icmp-forwarding: false
  dns-hijack:
  - 127.0.0.1:53
  enable: true
  endpoint-independent-nat: false
  gso: false
  mtu: 1400
  stack: system
  strict-route: false
unified-delay: true
rules:
- RULE-SET,private,DIRECT
- RULE-SET,privatecn,DIRECT
- RULE-SET,lancidr,DIRECT
- AND,((NETWORK,UDP),(DST-PORT,3478/19302)),REJECT
- DST-PORT,22,🖥️ SSH,no-resolve
- RULE-SET,domain-proxy-cidr,✈️ 墙外网站
- RULE-SET,allcidr,DIRECT,no-resolve
- RULE-SET,allipv6cidr,DIRECT,no-resolve
- RULE-SET,cncidr,DIRECT,no-resolve
- RULE-SET,direct,DIRECT
- GEOSITE,cn,DIRECT
- RULE-SET,applications,DIRECT
- GEOIP,private,DIRECT
- GEOIP,CN,DIRECT
- RULE-SET,icloud,🍏 苹果
- RULE-SET,apple,🍏 苹果
- RULE-SET,win-spy,Ⓜ️ 微软
- RULE-SET,win-update,Ⓜ️ 微软
- RULE-SET,win-extra,Ⓜ️ 微软
- RULE-SET,googlel,🐓 谷歌
- RULE-SET,Foreignmedia,🌍 国外媒体
- RULE-SET,Netflix,🎥 NETFLIX
- RULE-SET,proxy,✈️ 墙外网站
- RULE-SET,gfw,✈️ 墙外网站
- RULE-SET,tld-not-cn,✈️ 墙外网站
- RULE-SET,telegramcidr,✈️ 墙外网站,no-resolve
- GEOSITE,geolocation-!cn,✈️ 墙外网站
- RULE-SET,ip-proxy-cidr,✈️ 墙外网站,no-resolve
- RULE-SET,proxy-ip-cidr,✈️ 墙外网站,no-resolve
- GEOIP,facebook,✈️ 墙外网站,no-resolve
- MATCH,🐟 其他网站
